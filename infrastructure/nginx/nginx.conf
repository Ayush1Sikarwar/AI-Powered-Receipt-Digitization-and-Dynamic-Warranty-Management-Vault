# WarrantyVault AI — production reverse proxy (TSD §51: API gateway).
#
# Responsibilities:
#   - TLS termination (certs mounted at /etc/nginx/certs)
#   - HTTP -> HTTPS redirect
#   - Secure response headers (mirrored in the app as defense in depth)
#   - Static SPA hosting (frontend build)
#   - /api -> backend API (WebSocket-free, HTTP/1.1)
#   - Defense-in-depth request-rate zone (the app's Redis-backed limits are
#     the source of truth; this layer sheds bursts before they reach the app)
#
# /metrics is intentionally NOT routed: it stays on the backend's internal
# port only, scraped by the monitoring sidecar/agent, never the public edge.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access logs (TSD §40) — nginx JSON format.
    log_format access_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
        '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":$upstream_response_time,"method":"$request_method",'
        '"uri":"$uri","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log access_json;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # 15 MB upload cap + headroom (the app enforces the cap while streaming).
    client_max_body_size 16m;
    client_body_timeout 60s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Burst-shedding zone (defense in depth above the app's per-IP limits).
    limit_req_zone $binary_remote_addr zone=api_burst:10m rate=20r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- HTTP: redirect everything to HTTPS ---
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS: TLS + SPA + API proxy ---
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # --- Secure headers (TSD §51) ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # --- Static SPA (Vite build) ---
        root /usr/share/nginx/html;
        index index.html;

        location /assets/ {
            # Built assets are content-hashed; cache aggressively.
            expires 30d;
            add_header Cache-Control "public, immutable";
            # restate headers added by server (add_header is per-block)
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /favicon.ico { access_log off; }

        # --- API proxy ---
        location /api/ {
            limit_req zone=api_burst burst=40 nodelay;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;
            client_body_buffer_size 128k;
        }

        # Health endpoints for load balancers (no auth, no app logic).
        location = /health {
            proxy_pass http://backend:8000/health;
            access_log off;
        }
        location = /health/ready {
            proxy_pass http://backend:8000/health/ready;
            access_log off;
        }
    }
}
