# WarrantyVault AI — production PostgreSQL tuning (TSD §51).
# Mounted over the official image's default config.
#
# Sizing assumes the compose resource limits (1 GB container). Scale the
# memory values with the instance: shared_buffers ~ 25% of RAM.

listen_addresses = '*'
# (inter-container traffic on the private compose network; no host port is
# published, so this is not reachable from outside the network)

# --- Memory ---
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 8MB
maintenance_work_mem = 64MB
huge_pages = try

# --- Connections ---
max_connections = 100
# The app uses a bounded pool (SQLAlchemy default 5+10 per process);
# keep headroom for the migrate job and admin tooling.

# --- WAL / durability ---
synchronous_commit = on
wal_compression = on
checkpoint_completion_target = 0.9

# --- Logging (structured, greppable; TSD §40) ---
logging_collector = on
log_directory = 'log'
log_filename = 'postgres-%Y%m%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_min_duration_statement = 250ms   # slow-query visibility
log_disconnections = off
log_timezone = 'UTC'

# --- Time / locale ---
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C'

# --- Security (TSD §36 data security) ---
password_encryption = scram-sha-256
# TLS: the official postgres image generates self-signed certs on first boot.
# On a private compose network this is defense-in-depth; when the database
# must cross a less-trusted boundary, mount CA-signed certs at
# /var/lib/postgresql/certs and set ssl_cert_file/ssl_key_file accordingly.
ssl = on
