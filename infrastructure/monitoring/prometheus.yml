# WarrantyVault AI — Prometheus scrape config (TSD §40/§51).
#
# Runs as a sidecar/agent on the deployment host (or in compose with the
# `monitoring` profile). It scrapes the backend's /metrics over the internal
# network — /metrics is intentionally not routed through the public edge.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]   # provide your Alertmanager

scrape_configs:
  - job_name: warranty-vault-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          env: production
          service: api

  - job_name: warranty-vault-edge
    metrics_path: /metrics
    # nginx:prometheus exporter when the edge needs its own metrics;
    # access logs (JSON) are shipped separately for log-based alerting.
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          env: production
          service: edge
    scrape_interval: 30s
