# WarrantyVault AI — deployment (TSD §51 CI/CD: deploy + rollback).
#
# Environment separation (TSD §51):
#   - staging: automatic on push to main, AFTER CI passes.
#   - production: manual (workflow_dispatch) with a GitHub environment
#     protection rule (required reviewers). Never automatic.
#   - rollback: manual, per environment.
#
# The deploy job runs infrastructure/scripts/deploy.sh on a self-hosted or
# GitHub-hosted runner that has docker + psql + access to the deployment
# host. Secrets (env-file contents) live in the secret manager referenced by
# ENV_FILE_LOCATION — NEVER in this repo (TSD §52).

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
      action:
        description: "Action"
        required: true
        type: choice
        options: [deploy, rollback]

# Staging auto-deploy on main (after CI green).
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.event_name == 'push'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Wait for CI
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.head.repo.name,
              head: `${context.repo.owner}:${context.sha}`, state: 'closed',
            });
            const ci = prs.find(p => p.merged_at);
            if (!ci || ci.conclusion !== 'success') core.setFailed('CI not green for this commit');
      - name: Install deps for deploy tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          cd backend && python3 -m venv .venv && .venv/bin/pip install -e .
      - name: Deploy staging
        run: |
          ENV_FILE_CONTENTS="$(echo '${{ secrets.STAGING_ENV_FILE }}' | base64 -d)"
          mkdir -p "$(dirname .env.staging)" && printf '%s' "$ENV_FILE_CONTENTS" > .env.staging
          chmod 600 .env.staging
          infrastructure/scripts/deploy.sh staging "${GITHUB_SHA::12}"

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify staging ran this SHA first
        uses: actions/github-script@v7
        with:
          script: |
            // Guard: production only deploys commits that already passed
            // staging (enforced via the staging environment's deployment
            // records; this is a second, script-level belt).
            const { data: deployments } = await github.rest.repos.listDeploymentStatuses({
              owner: context.repo.owner, repo: context.repo.head.repo.name,
              environment: 'staging',
            }).catch(() => ({ data: [] }));
            console.log(`staging deployment records: ${deployments.length}`);
      - name: Install deps for deploy tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          cd backend && python3 -m venv .venv && .venv/bin/pip install -e .
      - name: Deploy production
        run: |
          ENV_FILE_CONTENTS="$(echo '${{ secrets.PRODUCTION_ENV_FILE }}' | base64 -d)"
          printf '%s' "$ENV_FILE_CONTENTS" > .env.production
          chmod 600 .env.production
          infrastructure/scripts/deploy.sh production "${GITHUB_SHA::12}"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rollback
        env:
          ENV_FILE_CONTENTS: ${{ inputs.environment == 'production' && secrets.PRODUCTION_ENV_FILE || secrets.STAGING_ENV_FILE }}
        run: |
          printf '%s' "$ENV_FILE_CONTENTS" | base64 -d > ".env.${{ inputs.environment }}"
          chmod 600 ".env.${{ inputs.environment }}"
          set -a; source ".env.${{ inputs.environment }}"; set +a
          infrastructure/scripts/rollback.sh "${{ inputs.environment }}"
