# WarrantyVault AI — CI (TSD §51: build, test, lint, security scan,
# migration validation; deploy jobs live in deploy.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: warranty
          POSTGRES_PASSWORD: warranty_ci_pw
          POSTGRES_DB: warranty_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warranty"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://warranty:warranty_ci_pw@127.0.0.1:5432/warranty_vault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install OCR (Tesseract)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          pg_dump --version | grep -q " 17\." || { echo "Expected PostgreSQL 17 pg_dump"; exit 1; }
      - name: Install Poppler
        run: sudo apt-get install -y -qq poppler-utils
      - name: Build (install runtime + dev deps)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: Type check (mypy)
        working-directory: backend
        run: mypy app
      - name: Security scan (pip-audit)
        working-directory: backend
        run: pip-audit
      - name: Migration validation (upgrade head -> downgrade -> upgrade)
        working-directory: backend
        run: |
          alembic upgrade head
          # Prove reversibility: every release must be able to roll back one
          # migration step (TSD rollback strategy).
          alembic downgrade -1
          alembic upgrade head
          alembic current
      - name: Tests (unit + API + security; migrations re-verified per suite)
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Security scan (npm audit, fail on high+)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: |
          docker build -f infrastructure/docker/backend.Dockerfile -t warranty-vault-backend:ci .
          docker run --rm --entrypoint python warranty-vault-backend:ci -c "import app.main; print('image import OK')"

      - name: Build frontend image (runtime target)
        run: |
          docker build -f infrastructure/docker/frontend.Dockerfile --target runtime \
            --build-arg VITE_API_BASE=/api/v1 -t warranty-vault-frontend:ci .


      - name: Validate frontend Nginx configuration
        run: |
          set -e
          docker network create warranty-ci-test
          docker volume create warranty-ci-certs
          trap 'docker rm -f backend 2>/dev/null || true; docker network rm warranty-ci-test 2>/dev/null || true; docker volume rm warranty-ci-certs 2>/dev/null || true' EXIT

          docker run --rm -v warranty-ci-certs:/certs alpine:3.21 sh -c "
            apk add --no-cache openssl >/dev/null &&
            openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
              -keyout /certs/privkey.pem \
              -out /certs/fullchain.pem \
              -subj '/CN=localhost'
          "

          docker run -d --name backend --network warranty-ci-test \
            --network-alias backend nginx:alpine

          docker run --rm --network warranty-ci-test \
            -v warranty-ci-certs:/etc/nginx/certs:ro \
            --entrypoint nginx warranty-vault-frontend:ci -t


      - name: Validate production compose (config parse)
        run: |
          # Compose must parse with a fully-populated env file (no defaults
          # leak through): supply placeholder values matching the template.
          sed -e 's/__GENERATE_WITH_openssl_rand_hex_32__/ciplaceholder000000000000000000000000000000000000000000000000/g' \
              -e 's/__S3_ACCESS_KEY_ID__/cikey/' -e 's/__S3_SECRET_ACCESS_KEY__/cisecret/' \
              -e 's/__SMTP_APP_PASSWORD__/cipass/' \
              infrastructure/environments/production.env.example > .env.production.ci
          docker compose -f infrastructure/docker/docker-compose.prod.yml \
            --env-file .env.production.ci config --quiet
          echo "compose.prod parses OK"
