[project]
name = "warranty-vault-backend"
version = "0.1.0"
description = "WarrantyVault AI backend - digital warranty vault with AI document processing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "email-validator>=2.1",
    "httpx>=0.27",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "Pillow>=10.3",
    "pytesseract>=0.3.10",
    "redis>=5.0",
    "rapidfuzz>=3.6",
    "reportlab>=4.1",
    "boto3>=1.34",
    "tenacity>=8.3",
    "pypdf>=4.2",
    "pdf2image>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI idiom: Depends() / Query() in argument defaults is the standard pattern.
"app/api/**" = ["B008"]
"tests/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
